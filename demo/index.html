<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bisnidaan Demo</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      width: min(1000px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(28px, 5vw, 42px);
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    p {
      margin-top: 18px;
      color: #666;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Bisnidaan Demo</h1>

    <div class="video">
      <!-- Replace YOUR_VIDEO_ID with your YouTube video ID -->
      <iframe
        src="https://www.youtube.com/embed/YOUR_VIDEO_ID"
        title="Bis-Nidaan Demo Video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <p>Watch the Bisnidaan project demonstration.</p>
  </main>
</body>
</html>
