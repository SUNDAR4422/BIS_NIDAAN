<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIS NIDAAN - Platform Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B2A5B',
                        trustblue: '#1F5FBF',
                        skymist: '#EAF2FF',
                        saffron: '#F28C28',
                        ink: '#101828',
                        slate: '#475467',
                        cloud: '#F7F9FC',
                        mist: '#D0D5DD'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy font-sans text-white min-h-screen flex flex-col items-center selection:bg-trustblue selection:text-white">
    <!-- Clean Minimal Header -->
    <header class="w-full max-w-6xl mx-auto px-6 py-8 flex justify-between items-center relative z-20">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-trustblue flex items-center justify-center font-bold text-lg text-white shadow-lg">
                BIS
            </div>
            <span class="font-bold text-xl tracking-wide">NIDAAN <span class="text-trustblue font-mono ml-1 text-sm bg-trustblue/10 px-2 py-0.5 rounded-full border border-trustblue/30">DEMO</span></span>
        </div>
        
        <a href="/" class="text-white/80 hover:text-white font-medium flex items-center gap-2 transition-colors">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Platform
        </a>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-5xl mx-auto px-4 md:px-6 flex-1 flex flex-col justify-center items-center py-12 relative z-10">
        <!-- Glow effect behind video -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-[60%] bg-trustblue/20 blur-[120px] rounded-full pointer-events-none"></div>

        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">See NIDAAN in Action.</h1>
            <p class="text-slate-300 text-lg md:text-xl max-w-2xl mx-auto">Watch how the platform verifies products via Hyperledger, handles real-time consumer tracking, and simplifies manufacturer onboarding.</p>
        </div>

        <!-- Video Container -->
        <div class="w-full aspect-video bg-ink rounded-2xl overflow-hidden shadow-2xl border border-white/10 relative z-20">
            <!-- Replace the video ID 'dQw4w9WgXcQ' below with your actual YouTube Video ID! -->
            <iframe 
                class="w-full h-full"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0&modestbranding=1" 
                title="BIS NIDAAN Platform Demo" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
        
        <div class="mt-8 flex gap-4">
             <a href="/consumer" class="bg-trustblue text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-blue-600 transition-all shadow-[0_0_20px_rgba(31,95,191,0.4)] hover:-translate-y-1">
                 Try Consumer Portal
             </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-8 text-center text-slate-400 text-sm mt-auto relative z-20 border-t border-white/10">
        &copy; 2024 Bureau of Indian Standards. All rights reserved.
    </footer>
</body>
</html>
